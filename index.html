<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <meta name="Description" content="React client for Helix 2.0">

        <title>
            Helix 2.0
        </title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">

        <style>
            :root {
                --font-family-sans-serif: 'PT Sans', sans-serif;
                --font-family-monospace: 'Inconsolata', monospace;
                --color-background: #fff;
                --color-text: rgba(0, 0, 0, .7);
            }

            html, body {
                position: relative;
                margin: 0;
                padding: 0;
                font-family: var(--font-family-sans-serif);
                color: var(--color-text);
            }

            * {
                box-sizing: border-box;
            }
        </style>

    </head>
    <body style="background-color: var(--color-background)">
        <noscript>
            Helix 2.0 needs Javascript.
        </noscript>
        <div id="helix-client-root">
        </div>
        <script
            type="module"
            src="/src/index.tsx"
        ></script>

        <script>
            if ('serviceWorker' in navigator) {
                // Unregister service worker
                navigator.serviceWorker.getRegistrations().then(registrations => {
                    for (const registration of registrations) {
                        registration.unregister();
                    }
                });
            }
        </script>
    </body>
</html>
